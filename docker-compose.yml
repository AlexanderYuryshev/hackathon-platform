# Log rotation: tiny disks cannot afford unbounded json-file logs.
# 10 MB x 3 files per container caps logs at ~30 MB each.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    logging: *default-logging
    environment:
      POSTGRES_USER: hackathon
      POSTGRES_PASSWORD: hackathon
      POSTGRES_DB: hackathon
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackathon -d hackathon"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    image: hackathon-backend:deploy
    logging: *default-logging
    command: ["/usr/local/bin/api"]
    environment:
      DATABASE_URL: postgres://hackathon:hackathon@db:5432/hackathon?sslmode=disable
      ADDR: ":8080"
      APP_ENV: dev
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    image: hackathon-backend:deploy
    logging: *default-logging
    command: ["/usr/local/bin/worker"]
    environment:
      DATABASE_URL: postgres://hackathon:hackathon@db:5432/hackathon?sslmode=disable
      APP_ENV: dev
    depends_on:
      db:
        condition: service_healthy

  simulator:
    build: ./backend
    image: hackathon-backend:deploy
    logging: *default-logging
    command: ["/usr/local/bin/sim"]
    profiles: ["demo"]
    environment:
      DATABASE_URL: postgres://hackathon:hackathon@db:5432/hackathon?sslmode=disable
      SIM_API_URL: http://api:8080
      SIM_TOKEN: demo-collector-token
      SIM_INTERVAL: 30s
    depends_on:
      - api

  frontend:
    build: ./frontend
    image: hackathon-frontend:deploy
    logging: *default-logging
    environment:
      APP_ENV: dev
    depends_on:
      - api

  proxy:
    image: nginx:1.27-alpine
    logging: *default-logging
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend

volumes:
  pgdata:
